<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Notice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #e8e8e0;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 560px;
    width: 100%;
    border: 2px solid #f5a623;
    background: #111;
    padding: 40px 36px 36px;
    position: relative;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* top stripe */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      #f5a623 0px, #f5a623 18px,
      #111 18px, #111 26px
    );
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f5a62322;
    border: 1px solid #f5a623;
    color: #f5a623;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 12px;
    margin-bottom: 24px;
  }

  .badge-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f5a623;
    animation: blink 1.1s step-start infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 5vw, 30px);
    line-height: 1.15;
    color: #fff;
    margin-bottom: 16px;
  }

  h1 span { color: #f5a623; }

  .divider {
    border: none;
    border-top: 1px solid #2a2a2a;
    margin: 20px 0;
  }

  p {
    font-size: 13.5px;
    line-height: 1.75;
    color: #a8a89e;
    margin-bottom: 10px;
  }

  p strong { color: #e8e8e0; }

  .action {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f5a623;
    color: #0d0d0d;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 11px 22px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .btn:hover { background: #ffc040; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn svg { flex-shrink: 0; }

  .note {
    font-size: 11.5px;
    color: #555;
    margin-top: 22px;
    border-top: 1px solid #1e1e1e;
    padding-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge"><span class="badge-dot"></span> Important Notice</div>

  <h1>Please Save<br>the <span>New Site.</span></h1>

  <hr class="divider">

  <p><strong>This site will no longer be available.</strong></p>
  <p>
    We have moved to a new location. Bookmark the new link now so you don't lose access to the platform.
  </p>

  <div class="action">
    <a class="btn" href="https://janithkottawa.github.io/Risk_Hub/" target="_blank">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Go to Remark_Hub
    </a>
  </div>

  <p class="note">⚠ Save this link before this page is taken down.</p>
</div>

</body>
</html>
