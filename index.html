<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f4c75 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: #e2e8f0;
        }

        /* Animated background elements */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .element-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #3b82f6, transparent);
            top: -100px;
            right: -100px;
            animation-duration: 25s;
        }

        .element-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            bottom: -50px;
            left: -100px;
            animation-duration: 20s;
            animation-direction: reverse;
        }

        .element-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #06b6d4, transparent);
            top: 50%;
            right: 10%;
            animation-duration: 30s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            25% {
                transform: translateY(-30px) translateX(20px);
            }
            50% {
                transform: translateY(-60px) translateX(-20px);
            }
            75% {
                transform: translateY(-30px) translateX(10px);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 40px;
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icon */
        .maintenance-icon {
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        .maintenance-icon svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Heading */
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
            animation: slideUp 0.8s ease-out 0.1s both;
        }

        /* Subheading */
        .subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        /* Message */
        .message {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.8;
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        .highlight {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.3), transparent);
            margin: 40px 0;
            animation: slideUp 0.8s ease-out 0.5s both;
        }

        /* Status indicator */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #cbd5e1;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #fbbf24;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .maintenance-icon svg {
                width: 60px;
                height: 60px;
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn {
                padding: 14px 32px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-element element-1"></div>
    <div class="bg-element element-2"></div>
    <div class="bg-element element-3"></div>

    <div class="container">
        <div class="maintenance-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
            </svg>
        </div>

        <h1>Under Maintenance</h1>
        <p class="subtitle">We're making improvements to serve you better</p>

        <p class="message">
            Our site is currently <span class="highlight">undergoing maintenance</span>. We'll be back online shortly with new features and improvements. In the meantime, check out our <span class="highlight">Risk Hub</span> for more information.
        </p>

        <a href="https://janithkottawa.github.io/Risk_Hub/" class="btn" target="_blank" rel="noopener noreferrer">
            Visit Risk Hub →
        </a>

        <div class="divider"></div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Status: Maintenance in progress</span>
        </div>
    </div>
</body>
</html>
